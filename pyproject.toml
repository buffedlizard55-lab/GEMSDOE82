[project]
name = "gemsdoe82"
version = "0.1.0"
description = "Auditable, format-safe fault discovery experiments for the DOE GEMS Prize"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
