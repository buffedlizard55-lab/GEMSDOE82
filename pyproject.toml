[project]
name = "gemsdoe82"
version = "0.1.0"
description = "GEMSDOE82: antislope-scarp + radiometric-break fault discovery for the DOE GEMS Prize (DrivenData #306)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "scikit-image>=0.21",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
